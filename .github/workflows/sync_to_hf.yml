name: Sync Backend to Hugging Face Spaces

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push backend to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://jeweltitus12:$HF_TOKEN@huggingface.co/spaces/jeweltitus12/pneumonia-detection master
